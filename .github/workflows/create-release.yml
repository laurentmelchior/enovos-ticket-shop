name: Create release on version bump

on:
  push:
    branches: [main]
    paths:
      - enovos-ticket-shop.php
      - CHANGELOG.md

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read plugin version
        id: version
        run: |
          VERSION=$(grep -E '^\s*\*\s*Version:' enovos-ticket-shop.php | sed -E 's/.*Version:\s*//')
          if [ -z "$VERSION" ]; then
            echo "Could not read Version from enovos-ticket-shop.php"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Plugin version: $VERSION"

      - name: Check if release already exists
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${VERSION} already exists — skipping release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No tag for ${VERSION} — will create release."
          fi

      - name: Build release notes from CHANGELOG.md
        id: notes
        if: steps.check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract the "Version X" block until the next Version heading (or EOF)
          NOTE=$(awk -v ver="$VERSION" '
            BEGIN { capturing = 0 }
            /^##[[:space:]]+Version[[:space:]]+/ {
              if (capturing) { exit }
              if ($3 == ver) { capturing = 1 }
              next
            }
            capturing { print }
          ' CHANGELOG.md | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')
          if [ -z "$NOTE" ]; then
            NOTE="Release ${VERSION}"
          fi
          {
            echo "body<<EOF"
            echo "$NOTE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.notes.outputs.body }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes "$NOTES" \
            --target "${{ github.sha }}"

      # Releases created with GITHUB_TOKEN do not trigger other workflows
      # (release: published). Explicitly dispatch the FTP deploy instead.
      - name: Trigger FTP deploy
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-ftp.yml --ref "${{ github.ref_name }}"
